# ┃                    Autostart Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.config/hypr/config/defaults.conf

# Autostart wiki https://wiki.hyprland.org/Configuring/Keywords/#executing

# exec-once = swaybg -o \* -i /usr/share/wallpapers/cachyos-wallpapers/Skyscraper.png -m fill
# exec-once = caelestia shell &
exec-once = hyprsunset &

# exec-once = swaybg -i '/home/khalid/Pictures/Wallpapers/wallhaven-w81rjp.jpg' -m fill &
exec-once = swaybg -i '/home/khalid/Pictures/Wallpapers/purple-cat-00006.png' -m fill &

exec-once = qs &

# exec-once = quickshell &
# exec-once = waybar &
exec-once = fcitx5 -d &
# exec-once = mako &
exec-once = nm-applet --indicator &
# exec-once = bash -c "mkfifo /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob && tail -f /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob | wob & disown" &
# exec-once = /usr/lib/polkit-kde-authentication-agent-1 &
exec-once = sysauth &

exec-once = wl-paste --type text --watch cliphist store &
exec-once = wl-paste --type image --watch cliphist store &

# ## Slow app launch fix
exec-once = systemctl --user import-environment &
exec-once = hash dbus-update-activation-environment 2>/dev/null &
exec-once = dbus-update-activation-environment --systemd &

exec-once = /usr/lib/xdg-desktop-portal-hyprland &
exec-once = /usr/lib/xdg-desktop-portal-gtk &

# ## Idle configuration
exec-once = $idlehandler

