# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Windowrules Configuration                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# -----------------------------------------------------
# Windows Rules
# https://wiki.hyprland.org/Configuring/Window-Rules/
# -----------------------------------------------------

# -- Float & Size Applications --
windowrule = match:class ^(org.gnome.Loupe)$, float on, size 70% 75%
windowrule = match:class ^(org.gnome.TextEditor)$, float on, size 60% 70%
windowrule = match:class ^(evince)$, float on, size 60% 70%
windowrule = match:class ^(Docker Desktop)$, float on, size 70% 70%
windowrule = match:class ^(io.bassi.Amberol)$, float on, size 50% 50%
windowrule = match:class ^(net.nokyan.Resources)$, float on, size 70% 70%
windowrule = match:class ^(org.gnome.Lollypop)$, float on, size 70% 70%
windowrule = match:class ^(be.alexandervanhee.gradia)$, float on, size 70% 70%
windowrule = match:class ^(com.interversehq.qView)$, float on, size 70% 70%
windowrule = match:class ^(org.gnome.Showtime)$, float on, size 70% 70%

# -- Float Only Applications --
windowrule = match:class ^(org.gnome.Calculator)$, float on
windowrule = match:title ^(Google Translate|TagStudio)$, float on
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, float on
windowrule = match:class ^(LibreWolf)$ match:title ^(Picture-in-Picture)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|xdg-desktop-portal-hyprland)(.*)$, float on
windowrule = match:class ^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org.org.kde.polkit-kde-authentication-agent-1)(.*)$, float on
windowrule = match:class ^(CachyOSHello)$, float on
windowrule = match:class ^(zenity)$, float on
windowrule = match:class ^(io.gitlab.adhami3310.Impression)$, float on

# -- Dialogs & Specific Titles --
# Note: Empty class matches 'match:class ^()$' are retained
windowrule = match:class ^()$ match:title ^(Picture in picture)$, float on
windowrule = match:class ^(org.quickshell)$ match:title ^(Settings)$, float on
windowrule = match:class ^()$ match:title ^(Save File)$, float on
windowrule = match:class ^()$ match:title ^(Open File)$, float on
windowrule = match:class ^()$ match:title ^(Steam - Self Updater)$, float on

# -- Opacity Rules --
# Amberol is already matched above for size/float, but we can add opacity here or combine it. 
# Kept separate for clarity of categories, but can be merged.
windowrule = match:class ^(io.bassi.Amberol)$, opacity 0.80
windowrule = match:class ^(thunar|nemo)$, opacity 0.92
# windowrule = match:class ^(code)$, opacity 0.94
windowrule = match:class ^(discord|armcord|webcord)$, opacity 0.96
windowrule = match:title ^(QQ|Telegram)$, opacity 0.95
windowrule = match:title ^(NetEase Cloud Music Gtk4)$, opacity 0.95

# -- General / Media Rules --
# Combined float, size, and move for Picture-in-Picture
windowrule = match:title ^(Picture-in-Picture)$, float on, size 960 540, move 25%-

# Combined rules for media players/terminals
windowrule = match:title ^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$, float on, move 25%-, size 960 540

# Specific tweaks
windowrule = match:title ^(danmufloat)$, pin on
windowrule = match:title ^(danmufloat|termfloat)$, rounding 5
windowrule = match:class ^(kitty|Alacritty)$, animation slide right
windowrule = match:class ^(org.mozilla.firefox)$, no_blur on

# -- Workspace & Decoration Logic --
# Decorations related to floating windows on workspaces 1 to 10
windowrule = match:float 1, match:workspace w[fv1-10], border_size 2, border_color $primary_color
# windowrule = match:float 1, match:workspace w[fv1-10], rounding 8

# Decorations related to tiling windows on workspaces 1 to 10
windowrule = match:float 0, match:workspace f[1-10], border_size 3, rounding 4


# -----------------------------------------------------
# Workspaces Rules
# https://wiki.hyprland.org/Configuring/Workspace-Rules/
# -----------------------------------------------------
# (Workspace declaration syntax remains largely distinct from Window Rules)

# workspace = 1, default:true, monitor:$priMon
# workspace = 6, default:true, monitor:$secMon
# workspace = r[1-5], monitor:$priMon
# workspace = r[6-10], monitor:$secMon
# workspace = special:scratchpad, on-created-empty:$applauncher
# workspace = w[tv1-10], gapsout:5, gapsin:3
workspace = f[1], gapsout:5, gapsin:3


# -----------------------------------------------------
# Layers Rules
# -----------------------------------------------------
# Using match:namespace for layer identification

layerrule = match:namespace logout_dialog, animation slide top
# layerrule = match:namespace waybar, animation popin 50%
layerrule = match:namespace waybar, animation slide down
layerrule = match:namespace wallpaper, animation fade 50%

# Wofi
layerrule = match:namespace wofi, blur on, ignore_alpha 0.5

# Kshell
layerrule = match:namespace kshell-bar, blur on, ignore_alpha 0.5

# Quickshell
layerrule = match:namespace quickshell, blur on, ignore_alpha 0.3