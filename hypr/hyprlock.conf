general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = /home/khalid/Pictures/Wallpapers/cat.jpg
    blur_passes = 1
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 400, 60
    outline_thickness = 3
    
    # Dot Settings
    dots_size = 0.7
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1 

    outer_color = rgba(5e, a1, f9, 0)
    inner_color = rgba(30, 30, 46, 0) 
    font_color = rgb(205, 214, 244)
    
    # Interaction Colors
    check_color = rgba(235 203 139, 0.8) # Lighter blue while checking
    fail_color = rgb(243, 139, 168) # Kept red for errors (standard UX)
    
    # Text & Font
    fade_on_empty = true
    fade_timeout = 0
    placeholder_text = <span foreground="##5ea1f999">●●●●●●●●●●●●</span>
    hide_input = false
    rounding = 20 

    # Positioning
    position = 0, -200
    halign = center
    valign = center

    # Transition Effects
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 0
}

# Hour-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%I")"
    color = rgba(EBCB8Bff) # Blue with transparency
    font_size = 300
    font_family = AlfaSlabOne 
    position = 0, 400
    halign = center
    valign = center
}

# Minute-Time
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%M")"
    color = rgba(255, 255, 255, .6)
    font_size = 300
    font_family = AlfaSlabOne
    position = 0, 75
    halign = center
    valign = center
}

# Day-Date-Month
label {
    monitor =
    text = cmd[update:1000] echo "<span color='##ffffff99'>$(date '+%A, ')</span><span color='##EBCB8B99'>$(date '+%d %B')</span>"
    font_size = 40
    font_family = SF Pro Display Bold
    position = 0, -80
    halign = center
    valign = center
    # Transition Effects
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 0 
}



