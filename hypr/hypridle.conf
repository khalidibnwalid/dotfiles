general {
    lock_cmd = pidof hyprlock || hyprlock       # dbus/sysd lock command (used by loginctl)
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display after sleep
}

listener {
    timeout = 300                                # 5 mins
    on-timeout = loginctl lock-session           # lock screen
}

listener {
    timeout = 330                                # 5.5 mins
    on-timeout = hyprctl dispatch dpms off       # turn off monitor
    on-resume = hyprctl dispatch dpms on         # turn on monitor on activity
}

listener {
    timeout = 900                                # 10 mins
    on-timeout = systemctl suspend               # suspend pc
}
